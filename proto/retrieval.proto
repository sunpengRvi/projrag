syntax = "proto3";

package retrieval;

// 定义检索服务
service DocumentRetriever {
  // 混合检索核心接口：接收问题，返回最相关的文档片段
  rpc SearchDocuments (SearchRequest) returns (SearchResponse) {}
}

// 8000 网关发过来的请求体
message SearchRequest {
  string query = 1;          // 用户的原始提问
  int32 top_k = 2;           // 需要召回的文档片段数量 (如 top 3)
}

// 返回给 8000 网关的检索结果
message SearchResponse {
  repeated DocumentChunk chunks = 1; // 召回的文档片段列表
}

// 单个文档片段的数据结构定义
message DocumentChunk {
  string content = 1;        // Markdown 文本内容
  string source = 2;         // 来源文件路径或标题 (方便大模型引用出处)
  float score = 3;           // 检索相似度打分 (用于排查检索质量)
}